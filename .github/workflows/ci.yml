name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: devbox run -- uv sync

      - name: Ruff check
        run: devbox run lint

      - name: Ruff format
        run: devbox run -- ruff format --check .

      - name: Pyright
        run: devbox run typecheck

      - name: Pytest
        run: devbox run test
